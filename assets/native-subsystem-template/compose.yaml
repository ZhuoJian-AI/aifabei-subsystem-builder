services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ZHUOJIAN_INTEGRATION_SECRET: ${ZHUOJIAN_INTEGRATION_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ZHUOJIAN_ORGANIZATION_ID: ${ZHUOJIAN_ORGANIZATION_ID:?}
      ZHUOJIAN_SAAS_ORIGINS: ${ZHUOJIAN_SAAS_ORIGINS:-https://ai-platform.staging.zhuojianai.com}
      DATABASE_PATH: /data/subsystem.db
    volumes:
      - subsystem_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  subsystem_data:
