<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__APPLICATION_NAME__</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#172033}.bar{display:flex;gap:12px;align-items:center;padding:18px 24px;background:#fff;border-bottom:1px solid #e7e9f2}.bar h1{font-size:18px;margin:0;flex:1}.main{padding:24px}.actions{display:flex;gap:10px;margin-bottom:18px}button{border:0;border-radius:8px;padding:10px 16px;background:#635bff;color:#fff;cursor:pointer}.card{background:#fff;border:1px solid #e4e7ef;border-radius:12px;padding:16px;margin:10px 0}.muted{color:#6f7787}.error{color:#b42318}</style></head>
<body><div class="bar"><h1>__APPLICATION_NAME__ · __MODULE_NAME__</h1><span class="muted">灼见原生模块</span></div><main class="main"><div class="actions"><button id="refresh">刷新</button></div><div id="status" class="muted">正在读取业务数据…</div><div id="records"></div></main>
<script>
const moduleKey='__MODULE_KEY__', pageKey='__MODULE_KEY__.list';
function bridgeOrigin(){try{const origin=new URL(document.referrer).origin;return origin.startsWith('https://')?origin:null}catch{return null}}
function sendToBridge(message){const target=bridgeOrigin();if(target&&parent!==window)parent.postMessage(message,target)}
function sendContext(){sendToBridge({type:'zhuojian:context',version:1,enterprise_key:'aifabei',application_slug:'__APPLICATION_SLUG__',module_key:moduleKey,page_key:pageKey,page_name:'__MODULE_NAME__列表',route:location.pathname,entity_type:moduleKey,entity_id:null,filters:{},selection:{},data_version:null})}
function render(items){document.getElementById('status').textContent=`共 ${items.length} 条`;document.getElementById('records').innerHTML=items.map(x=>`<div class="card"><strong>${x.id}</strong><div class="muted">状态 ${x.status} · 版本 ${x.version}</div><pre>${JSON.stringify(x,null,2)}</pre></div>`).join('')||'<div class="card muted">暂无数据，可让业务 AI 按真实需求补齐页面表单。</div>'}
async function load(){sendContext();document.getElementById('status').textContent='正在读取业务数据…';try{const r=await fetch(`/api/ui/actions/${moduleKey}.query`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pageKey,params:{}})});const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);render(body.items||[])}catch(e){document.getElementById('status').innerHTML=`<span class="error">${e.message}</span>`}}
document.getElementById('refresh').onclick=load;window.addEventListener('load',()=>{sendToBridge({type:'zhuojian:ready',version:1});load()});
</script></body></html>
