<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphabet 业务模块</title>
<script>if(window.parent!==window)document.documentElement.setAttribute('data-zhuojian-embedded','true')</script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#172033}.bar{display:flex;gap:12px;align-items:center;padding:18px 24px;background:#fff;border-bottom:1px solid #e7e9f2}.bar h1{font-size:18px;margin:0;flex:1}.main{padding:24px}.actions{display:flex;gap:10px;align-items:center;margin-bottom:18px}button{border:0;border-radius:8px;padding:10px 16px;background:#635bff;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}input[type=file]{max-width:360px}.card{background:#fff;border:1px solid #e4e7ef;border-radius:12px;padding:16px;margin:10px 0}.muted{color:#6f7787}.error{color:#b42318}.section{margin-top:28px}.file-row{display:flex;align-items:center;gap:12px}.file-row strong{flex:1}.link{background:#fff;color:#5148d8;border:1px solid #c9c5ff}</style></head>
<body><div class="bar"><h1 id="page-title">Alphabet 业务模块</h1><span class="muted">灼见原生模块</span></div><main class="main"><div class="actions"><button id="refresh">刷新</button></div><div id="status" class="muted">正在读取业务数据…</div><div id="records"></div><section class="section"><h2>业务文件</h2><div class="actions"><input id="file" type="file"><button id="upload">上传</button></div><div id="file-status" class="muted">正在读取文件…</div><div id="files"></div></section></main>
<script>
const moduleKey='__MODULE_KEY__', pageKey='__MODULE_KEY__.list';
const deleteAttempts=new Map();
let pageName='业务列表';
let applicationSlug='__APPLICATION_SLUG__', launchNonce='';
function bridgeOrigin(){try{const origin=new URL(document.referrer).origin;return origin.startsWith('https://')?origin:null}catch{return null}}
function sendToBridge(message){const target=bridgeOrigin();if(target&&parent!==window)parent.postMessage(message,target)}
function sendContext(){sendToBridge({type:'zhuojian:context',version:1,enterprise_key:'__COMPANY_SLUG__',application_slug:applicationSlug,launch_nonce:launchNonce,module_key:moduleKey,page_key:pageKey,page_name:pageName,route:location.pathname,entity_type:moduleKey,entity_id:null,filters:{},selection:{},data_version:null})}
function newRequestId(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));return `ui-${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`}
function node(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=String(text);return element}
function replaceWithMessage(container,text,className='muted'){container.replaceChildren(node('div',`card ${className}`,text))}
function setStatus(id,text,isError=false){const element=document.getElementById(id);element.textContent=String(text);element.className=isError?'error':'muted'}
function actionBody(operation,params={},expectedVersion=null,confirmation){const body={requestId:newRequestId(),moduleKey,pageKey,operation,expectedVersion,params};if(confirmation)body.confirmation=confirmation;return body}
async function loadBootstrap(){const params=new URLSearchParams({moduleKey,pageKey});const r=await fetch(`/api/ui/bootstrap?${params}`);const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);pageName=String(body.pageName||'业务列表');applicationSlug=String(body.applicationSlug||'');launchNonce=String(body.launchNonce||'');if(!applicationSlug||!launchNonce)throw new Error('当前模块启动上下文无效');const title=`${body.applicationName||'Alphabet'} · ${body.moduleName||'业务模块'}`;document.title=title;document.getElementById('page-title').textContent=title}
function render(items){setStatus('status',`共 ${items.length} 条`);const records=document.getElementById('records');records.replaceChildren();if(!items.length){replaceWithMessage(records,'暂无数据，可让业务 AI 按真实需求补齐页面表单。');return}for(const item of items){const card=node('div','card');card.append(node('strong','',item.id??''),node('div','muted',`状态 ${item.status??''} · 版本 ${item.version??''}`),node('pre','',JSON.stringify(item,null,2)));records.append(card)}}
async function load(){sendContext();setStatus('status','正在读取业务数据…');try{const body=actionBody('query');const r=await fetch(`/api/ui/actions/${moduleKey}.query`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.detail||`HTTP ${r.status}`);render(result.items||[])}catch(e){setStatus('status',e.message,true)}}
function fileParams(action){return new URLSearchParams({moduleKey,pageKey,actionKey:`${moduleKey}.${action}`})}
function downloadUrl(fileId){return `/api/ui/files/${encodeURIComponent(fileId)}?${fileParams('query')}`}
function renderFiles(items){setStatus('file-status',`共 ${items.length} 个文件`);const files=document.getElementById('files');files.replaceChildren();if(!items.length){replaceWithMessage(files,'暂无文件。');return}for(const item of items){const card=node('div','card file-row');const download=node('button','link','下载');const remove=node('button','link','删除');download.type='button';remove.type='button';download.addEventListener('click',()=>location.assign(downloadUrl(String(item.fileId))));remove.addEventListener('click',()=>deleteFile(String(item.fileId),Number(item.version)));card.append(node('strong','',item.filename??''),node('span','muted',`${item.size??0} bytes`),download,remove);files.append(card)}}
async function loadFiles(){setStatus('file-status','正在读取文件…');try{const r=await fetch(`/api/ui/files?${fileParams('query')}`);const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);renderFiles(body.items||[])}catch(e){setStatus('file-status',e.message,true)}}
async function upload(){const input=document.getElementById('file'),button=document.getElementById('upload'),file=input.files[0];if(!file){setStatus('file-status','请先选择文件');return}button.disabled=true;setStatus('file-status','正在上传…');try{const params=fileParams('create');params.set('filename',file.name);const r=await fetch(`/api/ui/files?${params}`,{method:'POST',headers:{'content-type':file.type||'application/octet-stream'},body:file});const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);input.value='';await loadFiles()}catch(e){setStatus('file-status',e.message,true)}finally{button.disabled=false}}
async function deleteFile(fileId,expectedVersion){if(!deleteAttempts.has(fileId)&&!confirm('确认删除这个文件？'))return;setStatus('file-status','正在删除…');try{let attempt=deleteAttempts.get(fileId);if(!attempt){const params={fileId};const requestId=newRequestId();const request={requestId,moduleKey,pageKey,actionKey:`${moduleKey}.delete`,operation:'delete',expectedVersion,params,confirmed:true,subject:'stored-file'};const issued=await fetch('/api/ui/confirmations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(request)});const confirmation=await issued.json();if(!issued.ok)throw new Error(confirmation.detail||`HTTP ${issued.status}`);attempt={requestId,moduleKey,pageKey,operation:'delete',expectedVersion,params,confirmation};deleteAttempts.set(fileId,attempt)}const r=await fetch(`/api/ui/files/${encodeURIComponent(fileId)}?${fileParams('delete')}`,{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify(attempt)});if(!r.ok){let body={};try{body=await r.json()}catch{}throw new Error(body.detail||`HTTP ${r.status}`)}deleteAttempts.delete(fileId);await loadFiles()}catch(e){setStatus('file-status',e.message,true)}}
document.getElementById('refresh').onclick=()=>{load();loadFiles()};document.getElementById('upload').onclick=upload;window.addEventListener('load',async()=>{try{await loadBootstrap();sendToBridge({type:'zhuojian:ready',version:1,application_slug:applicationSlug,launch_nonce:launchNonce});load();loadFiles()}catch(e){setStatus('status',e.message,true);setStatus('file-status',e.message,true)}});
</script></body></html>
