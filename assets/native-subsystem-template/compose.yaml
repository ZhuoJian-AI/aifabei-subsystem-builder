services:
  app:
    image: ${ZHUOJIAN_IMAGE_NAME:?}
    build: .
    restart: unless-stopped
    environment:
      ZHUOJIAN_INTEGRATION_SECRET: ${ZHUOJIAN_INTEGRATION_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ZHUOJIAN_ORGANIZATION_ID: ${ZHUOJIAN_ORGANIZATION_ID:?}
      ZHUOJIAN_SAAS_ORIGINS: ${ZHUOJIAN_SAAS_ORIGINS:-https://ai-platform.staging.zhuojianai.com}
      DATABASE_PATH: /data/subsystem.db
    volumes:
      - ${ZHUOJIAN_DATA_DIR:?}:/data
    ports:
      - "127.0.0.1:${ZHUOJIAN_APP_PORT:?}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
