# Installed only when no other Nginx default_server already exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Public 443 is owned by sslh on this Runtime; unknown TLS SNI is rejected here.
server {
    listen 127.0.0.1:8443 ssl default_server;
    listen [::1]:8443 ssl default_server;
    ssl_reject_handshake on;
}
